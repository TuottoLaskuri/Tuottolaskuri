<!DOCTYPE html>
<html lang="fi">
<head>
  <meta name="google-site-verification" content="tGWFBkeZBvQbLwF-rj-qFGnZDMoUL7fkgKidismYZV0" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuottoLaskuri - Ilmainen Korkoa Korolle -Laskuri</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 { color: var(--primary); margin-bottom: 5px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .input-group {
      margin-bottom: 15px;
    }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .result-box {
      background: #eff6ff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
    }
    .result-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }
    .affiliate-banner {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
    }
    .affiliate-btn {
      display: inline-block;
      background: #16a34a;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>TuottoLaskuri</h1>
    <p>Laske korkoa korolle -ilmiön voima sijoituksissasi</p>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Syötä tiedot</h2>
      <div class="input-group">
        <label>Alkupääoma (€)</label>
        <input type="number" id="initial" value="1000" oninput="calculate()">
      </div>
      <div class="input-group">
        <label>Kuukausisijoitus (€)</label>
        <input type="number" id="monthly" value="200" oninput="calculate()">
      </div>
      <div class="input-group">
        <label>Oletettu vuotuinen tuotto (%)</label>
        <input type="number" id="rate" value="8" step="0.5" oninput="calculate()">
      </div>
      <div class="input-group">
        <label>Sijoitusaika (vuotta)</label>
        <input type="number" id="years" value="20" oninput="calculate()">
      </div>

      <div class="result-box">
        <div>Arvioitu salkun arvo:</div>
        <div class="result-value" id="totalResult">0 €</div>
      </div>
    </div>

    <div class="card">
      <h2>Varallisuuden kehitys</h2>
      <canvas id="growthChart"></canvas>
      
      <!-- Monetisointipaikka / Affiliate-linkki -->
      <div class="affiliate-banner">
        <strong>Haluatko aloittaa sijoittamisen?</strong>
        <p style="font-size: 0.85rem; margin: 5px 0;">Avaa ilmainen arvo-osuustili ja laita korkoa korolle -ilmiö toimimaan.</p>
        <a href="#" class="affiliate-btn" target="_blank">Aloita sijoittaminen tästä &rarr;</a>
      </div>
    </div>
  </div>
</div>

<script>
  let chart;

  function calculate() {
    const initial = parseFloat(document.getElementById('initial').value) || 0;
    const monthly = parseFloat(document.getElementById('monthly').value) || 0;
    const rate = parseFloat(document.getElementById('rate').value) / 100 || 0;
    const years = parseInt(document.getElementById('years').value) || 0;

    let total = initial;
    let totalInvested = initial;
    const labels = [];
    const totalData = [];
    const investedData = [];

    const monthlyRate = rate / 12;

    for (let year = 1; year <= years; year++) {
      for (let month = 1; month <= 12; month++) {
        total = total * (1 + monthlyRate) + monthly;
        totalInvested += monthly;
      }
      labels.push('Vuosi ' + year);
      totalData.push(Math.round(total));
      investedData.push(Math.round(totalInvested));
    }

    document.getElementById('totalResult').innerText = Math.round(total).toLocaleString('fi-FI') + ' €';

    updateChart(labels, totalData, investedData);
  }

  function updateChart(labels, totalData, investedData) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Salkun kokonaisarvo (€)',
            data: totalData,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.2
          },
          {
            label: 'Oma sijoitettu pääoma (€)',
            data: investedData,
            borderColor: '#94a3b8',
            borderDash: [5, 5],
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }

  // Käynnistetään laskenta ladattaessa
  calculate();
</script>

</body>
</html>
